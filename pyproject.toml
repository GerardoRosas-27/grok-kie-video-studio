[project]
name = "video-studio"
version = "0.1.0"
description = "GUI video studio with session Grok and Kie options"
requires-python = ">=3.10"
dependencies = ["mcp>=1.9,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["app.py"]
